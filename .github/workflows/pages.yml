name: Build and deploy architecture
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-pages
  cancel-in-progress: false
jobs:
  build:
    name: Render, validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      site_sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked build dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --json > docs/dependency-audit.json || test -s docs/dependency-audit.json
          npm audit --audit-level=high
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Render all Mermaid diagrams
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          npm run render
      - name: Build and validate the offline viewer
        run: |
          npm run build
          npm test
          npm run test:browser
          npm run build
      - name: Record tested build digest
        id: digest
        run: echo "sha256=$(sha256sum _site/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Commit refreshed generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Build validated dark architecture assets [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-validation
          path: |
            docs/validation-*.json
            docs/dependency-audit.json
            docs/preview-*.png
  deploy:
    name: Publish and verify GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the live site matches the tested artifact
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.build.outputs.site_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,time,urllib.request
          url=os.environ['SITE_URL']
          expected=os.environ['EXPECTED_SHA256']
          for attempt in range(18):
              try:
                  request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'ArchitectureDeploymentCheck'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      body=response.read()
                      assert response.status==200, 'Expected HTTP 200'
                  digest=hashlib.sha256(body).hexdigest()
                  assert digest==expected, 'CDN still serves a previous build'
                  text=body.decode('utf-8')
                  match=re.search(r'<script[^>]*id="architecture-data"[^>]*>(.*?)</script>',text,re.S)
                  assert match, 'Embedded architecture data missing'
                  data=json.loads(match.group(1))
                  assert len(data['diagrams'])==18, 'Expected all 18 views'
                  assert 'color-scheme:dark' in text, 'Dark theme missing'
                  print(json.dumps({'url':url,'http_status':200,'views':18,'bytes':len(body),'sha256':digest,'matches_tested_artifact':True},indent=2))
                  break
              except Exception as error:
                  if attempt==17:raise
                  print(f'Waiting for Pages propagation ({attempt+1}/18): {error}')
                  time.sleep(10)
          PY
